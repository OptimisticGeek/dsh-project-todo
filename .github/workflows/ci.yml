name: ci

# The plugin ships to macOS, Linux and Windows; run the whole suite on all
# three so a platform-only break (symlinks, path casing, line endings) fails
# here instead of on a user's machine.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: node --test
